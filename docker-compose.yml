version: '3.9'
services:
  backend:
    image: ghcr.io/amfoss/ammentor-backend:${TAG:-praveshan}
    container_name: praveshan-ammentor-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14
    container_name: praveshan-ammentor-db
    restart: always
    environment:
      POSTGRES_DB: praveshan-ammentor
      POSTGRES_USER: ammentor_user
      POSTGRES_PASSWORD: strongpassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ammentor_user -d praveshan-ammentor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: